[package]
name = "rust_ram_disk"
version = "0.1.0"
edition = "2021"
authors = ["William Wang <5100752+twasa@users.noreply.github.com>"]
description = "High-performance RAM Disk with Dynamic Sparse Allocation, Transparent Compression, and Windows Systray Integration"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
parking_lot = "0.12"
lz4_flex = "0.14"
thiserror = "2.0"
anyhow = "1.0"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.27"
muda = "0.22"
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Console", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

# WinFsp support (optional feature, so core engine can be built and tested independently)
winfsp = { version = "0.13", optional = true }

[build-dependencies]
winfsp = { version = "0.13", optional = true }

[features]
default = []
winfsp-mount = ["dep:winfsp"]
